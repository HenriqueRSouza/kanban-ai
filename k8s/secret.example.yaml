# Só documentação: mostra as chaves que o Secret precisa ter.
# Não aplique este arquivo. O scripts/k8s-up.sh cria o Secret a partir do .env:
#   kubectl -n taskflow create secret generic taskflow-secrets --from-literal=...
apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  POSTGRES_USER: taskflow
  POSTGRES_PASSWORD: <senha>
  RABBITMQ_USER: taskflow
  RABBITMQ_PASSWORD: <senha>
  LLM_API_KEY: ""   # só com LLM_PROVIDER=openrouter
