# Único ponto de entrada da aplicação: serve o front (build estático do React)
# e encaminha /api para o Serviço A. Nenhum outro container publica porta.

# Reaproveita o X-Request-Id enviado pelo cliente (útil em demonstrações) ou gera um.
map $http_x_request_id $correlation_id {
  default $http_x_request_id;
  ""      $request_id;
}

# Log em JSON, no mesmo formato dos serviços, para seguir a operação pelo correlationId.
log_format taskflow escape=json
  '{"ts":"$time_iso8601","service":"nginx","instance":"$hostname","event":"http.received",'
  '"correlationId":"$correlation_id","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"requestTimeS":$request_time,"upstream":"$upstream_addr"}';

server {
  listen 80;
  server_name _;
  access_log /dev/stdout taskflow;

  root /usr/share/nginx/html;
  add_header X-Request-Id $correlation_id always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $correlation_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Request-Id $correlation_id always;
  }

  # SPA: qualquer outra rota devolve o index.html.
  location / {
    try_files $uri /index.html;
  }
}
