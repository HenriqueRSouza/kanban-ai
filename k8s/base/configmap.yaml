# Configuração não sensível. Senhas e token ficam no Secret "taskflow-secrets",
# criado pelo scripts/k8s-up.sh a partir do .env (nunca versionado).
apiVersion: v1
kind: ConfigMap
metadata:
  name: taskflow-config
data:
  POSTGRES_DB: taskflow
  # O Ollama roda como sidecar no mesmo pod do worker: localhost.
  LLM_PROVIDER: ollama
  LLM_MODEL: qwen3:1.7b
  LLM_BASE_URL: http://localhost:11434/v1
  LLM_TIMEOUT_MS: "120000"
