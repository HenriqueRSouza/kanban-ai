# Ponto de entrada do cluster (NGINX Ingress Controller): /api vai para o
# Serviço A, o resto para o front. É o papel que o container nginx tinha no Compose.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api, port: { number: 3000 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: web, port: { number: 80 } }
